name: PakThai Studio - Windows installer

# Builds the Windows (x64) installer on every push to main (or "Run workflow"
# in the Actions tab) and publishes it as the GitHub Release for the version in
# package.json, which the in-app updater reads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  omnivoice-tts:
    uses: ./.github/workflows/build-omnivoice-tts.yml
    with:
      desktop: true
      retention_days: 3

  windows:
    needs: omnivoice-tts
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
      VOICESTUDIO_OMNIVOICE_TTS_PLATFORM: windows-x86_64
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-win32-x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop-bridge -> target
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Bundle pinned uv
        env:
          GH_TOKEN: ${{ github.token }}
        run: node electron/scripts/stage-bundled-uv.mjs
      - name: Stage the OmniVoice GGUF runtime
        uses: actions/download-artifact@v4
        with:
          name: omnivoice-tts-windows-x86_64
          path: electron/build/omnivoice-tts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build app
        run: bun run --cwd electron build
      - name: Package installer
        working-directory: electron
        run: bun x electron-builder --config electron-builder.config.mjs --win --x64 --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PakThai-Studio-Windows
          path: |
            electron/release/*.exe
            electron/release/*.yml
            electron/release/*.blockmap
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          files=(electron/release/*.exe electron/release/*.yml electron/release/*.blockmap)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "PakThai Studio $tag" --notes "PakThai Studio for Windows (x64). Download the .exe below and run it to install."
          fi
